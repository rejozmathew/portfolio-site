<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="tf" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F4E79" flood-opacity="0.12"/>
    </filter>
    <marker id="tfArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#1F4E79"/></marker>
  </defs>

  <rect width="920" height="430" fill="#f9fafb" rx="8"/>
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1F4E79">Two Testing Layers, Two Different Questions</text>

  <!-- Layer 1: Champion/Challenger -->
  <rect x="35" y="60" width="850" height="150" rx="10" fill="white" stroke="#E97451" stroke-width="1.5" filter="url(#tf)"/>
  <rect x="35" y="60" width="850" height="34" rx="10" fill="#E97451"/>
  <rect x="35" y="84" width="850" height="10" fill="#E97451"/>
  <text x="460" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="white">LAYER 1 · CHAMPION vs CHALLENGER — "Is the new model better?"  (temporary)</text>

  <!-- Split visualization -->
  <rect x="60" y="110" width="130" height="80" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="125" y="135" text-anchor="middle" font-size="10" font-weight="600" fill="#2C3E50">Eligible</text>
  <text x="125" y="150" text-anchor="middle" font-size="10" font-weight="600" fill="#2C3E50">Population</text>
  <text x="125" y="172" text-anchor="middle" font-size="9" fill="#94A3B8">(random split)</text>

  <line x1="190" y1="132" x2="240" y2="122" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>
  <line x1="190" y1="168" x2="240" y2="178" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>

  <rect x="245" y="104" width="240" height="40" rx="6" fill="#E8F4FD" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="365" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#1F4E79">50% CHAMPION — current model (ML 1.0)</text>
  <text x="365" y="136" text-anchor="middle" font-size="9" fill="#64748B">Offers ranked by incumbent scores</text>

  <rect x="245" y="152" width="240" height="40" rx="6" fill="#E8FAF0" stroke="#2A7F62" stroke-width="1.5"/>
  <text x="365" y="169" text-anchor="middle" font-size="10" font-weight="700" fill="#2A7F62">50% CHALLENGER — new model (ML 2.0)</text>
  <text x="365" y="184" text-anchor="middle" font-size="9" fill="#64748B">Offers ranked by new scores</text>

  <line x1="485" y1="148" x2="535" y2="148" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>

  <rect x="540" y="112" width="150" height="72" rx="8" fill="#FFF7ED" stroke="#E97451" stroke-width="1"/>
  <text x="615" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="#E97451">Run 2–3 months,</text>
  <text x="615" y="150" text-anchor="middle" font-size="10" font-weight="600" fill="#E97451">measure lift,</text>
  <text x="615" y="166" text-anchor="middle" font-size="10" font-weight="600" fill="#E97451">check significance</text>

  <line x1="690" y1="148" x2="740" y2="148" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>

  <rect x="745" y="112" width="125" height="72" rx="8" fill="#2A7F62"/>
  <text x="807" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="white">Winner promoted.</text>
  <text x="807" y="154" text-anchor="middle" font-size="9" fill="#D1FAE5">Test ends. Challenger</text>
  <text x="807" y="168" text-anchor="middle" font-size="9" fill="#D1FAE5">becomes champion.</text>

  <!-- Layer 2: Permanent holdout -->
  <rect x="35" y="230" width="850" height="150" rx="10" fill="white" stroke="#1F4E79" stroke-width="1.5" filter="url(#tf)"/>
  <rect x="35" y="230" width="850" height="34" rx="10" fill="#1F4E79"/>
  <rect x="35" y="254" width="850" height="10" fill="#1F4E79"/>
  <text x="460" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="white">LAYER 2 · PERSONALIZATION HOLDOUT — "Is personalization itself worth it?"  (permanent)</text>

  <rect x="60" y="280" width="130" height="80" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="125" y="305" text-anchor="middle" font-size="10" font-weight="600" fill="#2C3E50">Full</text>
  <text x="125" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#2C3E50">Population</text>
  <text x="125" y="342" text-anchor="middle" font-size="9" fill="#94A3B8">(always split)</text>

  <line x1="190" y1="302" x2="240" y2="292" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>
  <line x1="190" y1="338" x2="240" y2="348" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>

  <rect x="245" y="274" width="240" height="40" rx="6" fill="#E8FAF0" stroke="#2A7F62" stroke-width="1.5"/>
  <text x="365" y="291" text-anchor="middle" font-size="10" font-weight="700" fill="#2A7F62">~90% PERSONALIZED</text>
  <text x="365" y="306" text-anchor="middle" font-size="9" fill="#64748B">Whatever the current champion model is</text>

  <rect x="245" y="322" width="240" height="40" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="365" y="339" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">~10% RANDOM HOLDOUT</text>
  <text x="365" y="354" text-anchor="middle" font-size="9" fill="#94A3B8">No personalization logic applied</text>

  <line x1="485" y1="318" x2="535" y2="318" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>

  <rect x="540" y="282" width="150" height="72" rx="8" fill="#E8F4FD" stroke="#1F4E79" stroke-width="1"/>
  <text x="615" y="304" text-anchor="middle" font-size="10" font-weight="600" fill="#1F4E79">Gap between groups =</text>
  <text x="615" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#1F4E79">incremental value of</text>
  <text x="615" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#1F4E79">personalization</text>

  <line x1="690" y1="318" x2="740" y2="318" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#tfArr)"/>

  <rect x="745" y="282" width="125" height="72" rx="8" fill="white" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="807" y="302" text-anchor="middle" font-size="9" font-weight="700" fill="#1F4E79">Never ends. Funds</text>
  <text x="807" y="316" text-anchor="middle" font-size="9" fill="#64748B">attribution credibility,</text>
  <text x="807" y="330" text-anchor="middle" font-size="9" fill="#64748B">decay detection,</text>
  <text x="807" y="344" text-anchor="middle" font-size="9" fill="#64748B">governance proof</text>

  <text x="460" y="408" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">During a champion/challenger test, the 90% personalized group is temporarily split 45/45 — the holdout stays untouched as the fixed reference point</text>
</svg>
