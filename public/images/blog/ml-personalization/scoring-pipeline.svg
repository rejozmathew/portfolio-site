<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="sp" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F4E79" flood-opacity="0.12"/>
    </filter>
    <marker id="spArr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#1F4E79"/></marker>
  </defs>

  <rect width="920" height="300" fill="#f9fafb" rx="8"/>
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1F4E79">From Raw Score to Ranked Offer</text>
  <text x="460" y="50" text-anchor="middle" font-size="11" fill="#94A3B8" font-style="italic">The propensity score that drives ranking is not the raw model output</text>

  <!-- Step 1: Raw output -->
  <rect x="30" y="80" width="155" height="120" rx="10" fill="white" stroke="#94A3B8" stroke-width="1.5" filter="url(#sp)"/>
  <rect x="30" y="80" width="155" height="30" rx="10" fill="#94A3B8"/>
  <rect x="30" y="100" width="155" height="10" fill="#94A3B8"/>
  <text x="107" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="white">1 · Raw DNN Output</text>
  <text x="107" y="130" text-anchor="middle" font-size="10" fill="#2C3E50">Sigmoid score, e.g.</text>
  <text x="107" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8">0.09</text>
  <text x="107" y="170" text-anchor="middle" font-size="9" fill="#64748B">Inflated — trained on</text>
  <text x="107" y="184" text-anchor="middle" font-size="9" fill="#64748B">resampled data</text>

  <line x1="185" y1="140" x2="215" y2="140" stroke="#1F4E79" stroke-width="2" marker-end="url(#spArr)"/>

  <!-- Step 2: Calibration -->
  <rect x="218" y="80" width="155" height="120" rx="10" fill="white" stroke="#1F4E79" stroke-width="2" filter="url(#sp)"/>
  <rect x="218" y="80" width="155" height="30" rx="10" fill="#1F4E79"/>
  <rect x="218" y="100" width="155" height="10" fill="#1F4E79"/>
  <text x="295" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="white">2 · Calibration</text>
  <text x="295" y="130" text-anchor="middle" font-size="10" fill="#2C3E50">Correct for sampling</text>
  <text x="295" y="146" text-anchor="middle" font-size="10" fill="#2C3E50">distortion →</text>
  <text x="295" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E79">0.003</text>
  <text x="295" y="186" text-anchor="middle" font-size="9" fill="#64748B">Now a true probability</text>

  <line x1="373" y1="140" x2="403" y2="140" stroke="#1F4E79" stroke-width="2" marker-end="url(#spArr)"/>

  <!-- Step 3: Seasonal -->
  <rect x="406" y="80" width="155" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="1.5" filter="url(#sp)"/>
  <rect x="406" y="80" width="155" height="30" rx="10" fill="#7C3AED"/>
  <rect x="406" y="100" width="155" height="10" fill="#7C3AED"/>
  <text x="483" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="white">3 · Seasonal Adjust</text>
  <text x="483" y="130" text-anchor="middle" font-size="10" fill="#2C3E50">Time-of-year effects</text>
  <text x="483" y="146" text-anchor="middle" font-size="10" fill="#2C3E50">on response rates</text>
  <text x="483" y="170" text-anchor="middle" font-size="9" fill="#64748B">e.g. balance transfers</text>
  <text x="483" y="184" text-anchor="middle" font-size="9" fill="#64748B">spike post-holidays</text>

  <line x1="561" y1="140" x2="591" y2="140" stroke="#1F4E79" stroke-width="2" marker-end="url(#spArr)"/>

  <!-- Step 4: NPV -->
  <rect x="594" y="80" width="155" height="120" rx="10" fill="white" stroke="#E97451" stroke-width="1.5" filter="url(#sp)"/>
  <rect x="594" y="80" width="155" height="30" rx="10" fill="#E97451"/>
  <rect x="594" y="100" width="155" height="10" fill="#E97451"/>
  <text x="671" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="white">4 · × Value per Conv.</text>
  <text x="671" y="130" text-anchor="middle" font-size="10" fill="#2C3E50">Probability × NPV</text>
  <text x="671" y="148" text-anchor="middle" font-size="10" fill="#2C3E50">(segment-level)</text>
  <text x="671" y="170" text-anchor="middle" font-size="9" fill="#64748B">Makes scores comparable</text>
  <text x="671" y="184" text-anchor="middle" font-size="9" fill="#64748B">across products</text>

  <line x1="749" y1="140" x2="779" y2="140" stroke="#1F4E79" stroke-width="2" marker-end="url(#spArr)"/>

  <!-- Step 5: Ranked sequence -->
  <rect x="782" y="80" width="115" height="120" rx="10" fill="#2A7F62" filter="url(#sp)"/>
  <text x="839" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="white">5 · Expected</text>
  <text x="839" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="white">Value Ranking</text>
  <rect x="794" y="130" width="91" height="16" rx="3" fill="white" opacity="0.95"/><text x="839" y="142" text-anchor="middle" font-size="8.5" fill="#2A7F62" font-weight="600">1. Personal Loan</text>
  <rect x="794" y="150" width="91" height="16" rx="3" fill="white" opacity="0.75"/><text x="839" y="162" text-anchor="middle" font-size="8.5" fill="#2A7F62">2. Balance Transfer</text>
  <rect x="794" y="170" width="91" height="16" rx="3" fill="white" opacity="0.55"/><text x="839" y="182" text-anchor="middle" font-size="8.5" fill="#2A7F62">3. Identity Protect</text>

  <!-- Bottom callout -->
  <rect x="130" y="222" width="660" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#1F4E79">Why calibration is non-negotiable</text>
  <text x="460" y="262" text-anchor="middle" font-size="10" fill="#64748B">Without it, cross-product comparison breaks: an inflated 0.09 × $500 looks like $45 of expected value when the</text>
  <text x="460" y="276" text-anchor="middle" font-size="10" fill="#64748B">truth is 0.003 × $500 = $1.50. Rank order within one offer survives; the ranking across offers does not.</text>
</svg>
