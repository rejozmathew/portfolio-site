<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="nv" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F4E79" flood-opacity="0.12"/>
    </filter>
    <marker id="nvArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94A3B8"/></marker>
    <marker id="nvArrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2A7F62"/></marker>
    <marker id="bigArr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#1F4E79"/></marker>
  </defs>

  <rect width="920" height="420" fill="#f9fafb" rx="8"/>
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1F4E79">The Organizational Transformation</text>
  <text x="460" y="50" text-anchor="middle" font-size="11" fill="#94A3B8" font-style="italic">How marketing real estate went from politically negotiated to algorithmically allocated</text>

  <!-- BEFORE panel -->
  <rect x="35" y="70" width="390" height="300" rx="10" fill="white" stroke="#94A3B8" stroke-width="1.5" filter="url(#nv)"/>
  <rect x="35" y="70" width="390" height="36" rx="10" fill="#94A3B8"/>
  <rect x="35" y="96" width="390" height="10" fill="#94A3B8"/>
  <text x="230" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="white">BEFORE: Negotiated Strategies</text>

  <!-- Product teams lobbying -->
  <rect x="55" y="122" width="105" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="107" y="139" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Loans Team</text>
  <text x="107" y="151" text-anchor="middle" font-size="8" fill="#94A3B8">"We need the banner"</text>

  <rect x="177" y="122" width="105" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="229" y="139" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Cards Team</text>
  <text x="229" y="151" text-anchor="middle" font-size="8" fill="#94A3B8">"BT is priority"</text>

  <rect x="299" y="122" width="105" height="34" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="351" y="139" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Deposits Team</text>
  <text x="351" y="151" text-anchor="middle" font-size="8" fill="#94A3B8">"Savings this quarter"</text>

  <!-- Arrows down to negotiation -->
  <line x1="107" y1="156" x2="180" y2="196" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#nvArr)"/>
  <line x1="229" y1="156" x2="229" y2="196" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#nvArr)"/>
  <line x1="351" y1="156" x2="278" y2="196" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#nvArr)"/>

  <!-- Negotiation table -->
  <rect x="140" y="200" width="180" height="46" rx="8" fill="#FFF7ED" stroke="#E97451" stroke-width="1.5"/>
  <text x="230" y="219" text-anchor="middle" font-size="10" font-weight="700" fill="#E97451">QUARTERLY NEGOTIATION</text>
  <text x="230" y="236" text-anchor="middle" font-size="9" fill="#64748B">Placement by org clout &amp; calendar</text>

  <line x1="230" y1="246" x2="230" y2="272" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#nvArr)"/>

  <!-- Fixed placement -->
  <rect x="120" y="276" width="220" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="230" y="293" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Same offer shown to every customer</text>
  <text x="230" y="308" text-anchor="middle" font-size="9" fill="#94A3B8">for the whole campaign window</text>

  <g font-size="8.5" fill="#94A3B8">
    <text x="230" y="338" text-anchor="middle">Loudest voice wins · Static assignments · No customer signal</text>
    <text x="230" y="352" text-anchor="middle">Success = securing placement, not conversion economics</text>
  </g>

  <!-- Transformation arrow -->
  <line x1="432" y1="220" x2="482" y2="220" stroke="#1F4E79" stroke-width="3.5" marker-end="url(#bigArr)"/>

  <!-- AFTER panel -->
  <rect x="495" y="70" width="390" height="300" rx="10" fill="white" stroke="#2A7F62" stroke-width="2" filter="url(#nv)"/>
  <rect x="495" y="70" width="390" height="36" rx="10" fill="#2A7F62"/>
  <rect x="495" y="96" width="390" height="10" fill="#2A7F62"/>
  <text x="690" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="white">AFTER: Value-Based Decisioning</text>

  <!-- Product teams supplying economics -->
  <rect x="515" y="122" width="105" height="34" rx="6" fill="#E8FAF0" stroke="#2A7F62" stroke-width="1"/>
  <text x="567" y="139" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Loans Team</text>
  <text x="567" y="151" text-anchor="middle" font-size="8" fill="#2A7F62">Supplies offer + NPV</text>

  <rect x="637" y="122" width="105" height="34" rx="6" fill="#E8FAF0" stroke="#2A7F62" stroke-width="1"/>
  <text x="689" y="139" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Cards Team</text>
  <text x="689" y="151" text-anchor="middle" font-size="8" fill="#2A7F62">Supplies offer + NPV</text>

  <rect x="759" y="122" width="105" height="34" rx="6" fill="#E8FAF0" stroke="#2A7F62" stroke-width="1"/>
  <text x="811" y="139" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Deposits Team</text>
  <text x="811" y="151" text-anchor="middle" font-size="8" fill="#2A7F62">Supplies offer + NPV</text>

  <line x1="567" y1="156" x2="640" y2="196" stroke="#2A7F62" stroke-width="1.5" marker-end="url(#nvArrG)"/>
  <line x1="689" y1="156" x2="689" y2="196" stroke="#2A7F62" stroke-width="1.5" marker-end="url(#nvArrG)"/>
  <line x1="811" y1="156" x2="738" y2="196" stroke="#2A7F62" stroke-width="1.5" marker-end="url(#nvArrG)"/>

  <!-- Algorithm -->
  <rect x="590" y="200" width="200" height="46" rx="8" fill="#1F4E79"/>
  <text x="690" y="219" text-anchor="middle" font-size="10" font-weight="700" fill="white">EXPECTED VALUE ALGORITHM</text>
  <text x="690" y="236" text-anchor="middle" font-size="9" fill="#BFDBFE">Propensity × NPV per customer</text>

  <line x1="690" y1="246" x2="690" y2="272" stroke="#2A7F62" stroke-width="1.5" marker-end="url(#nvArrG)"/>

  <!-- Personalized outcome -->
  <rect x="580" y="276" width="220" height="40" rx="6" fill="#E8FAF0" stroke="#2A7F62" stroke-width="1"/>
  <text x="690" y="293" text-anchor="middle" font-size="9" font-weight="600" fill="#2C3E50">Different offer per customer,</text>
  <text x="690" y="308" text-anchor="middle" font-size="9" fill="#2A7F62">re-decided on every visit</text>

  <g font-size="8.5" fill="#2A7F62">
    <text x="690" y="338" text-anchor="middle">Neutral arbiter · Teams compete on offer economics</text>
    <text x="690" y="352" text-anchor="middle">Success = expected value delivered, measured vs. holdout</text>
  </g>

  <!-- Bottom insight -->
  <text x="460" y="400" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">The hardest part wasn't the model — it was getting product teams to accept an algorithm as the referee for contested marketing real estate</text>
</svg>
